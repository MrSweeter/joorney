<!doctype html>
<html lang="en">
    <head>
        <title data-i18n="options_title">Joorney Configuration</title>
        <link rel="icon" type="image/x+icon" href="./../images/icon_128.svg">
        <meta charset="utf-8">
        <!-- Material Symbols (assets/icons, npm run icons:fetch) -->
        <link href="../assets/icons/icons.css" rel="stylesheet">
        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet">
        <!-- MDB -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.1/mdb.min.css" rel="stylesheet">

        <link href="./css/ui/tokens.css" rel="stylesheet">
        <link href="./css/ui/base.css" rel="stylesheet">
        <link href="./css/ui/navbar.css" rel="stylesheet">
        <link href="./css/ui/feature_card.css" rel="stylesheet">
        <link href="./css/ui/modal.css" rel="stylesheet">
        <link href="./css/ui/mode_menu.css" rel="stylesheet">
        <link href="./css/ui/announce.css" rel="stylesheet">
        <link href="./index.css" rel="stylesheet">
        <link href="./checklist.css" rel="stylesheet">
        <script src="index.js"></script>
    </head>
    <body class="joorney-body-background d-flex flex-column">
        <!-- Menu: options/src/layout.js -->
        <nav class="joorney-nav" id="joorney-navig-menu" aria-label="Main menu" data-i18n-aria-label="options_menu_main">
            <button type="button" id="joorney-brand-debug" class="joorney-nav-brand" title="Debug mode" data-i18n-title="options_debugMode">
                <span class="joorney-nav-logo"><img loading="lazy" src="/images/icon_128.png" alt="Joorney logo" data-i18n-alt="options_logoAlt"></span>
                <span>Joorney</span>
            </button>
            <ul id="joorney-menu-items-container" class="joorney-nav-links"></ul>
            <span class="joorney-nav-spacer"></span>
            <span id="joorney-manifest" class="joorney-nav-version"></span>
            <button
                type="button"
                id="joorney_checklist_show_btn"
                class="joorney-icon-btn joorney-nav-checklist"
                title="Get started with Joorney"
                aria-label="Get started with Joorney"
                data-i18n-title="checklist_panelTitle"
                data-i18n-aria-label="checklist_panelTitle"
                aria-controls="joorney_checklist"
                aria-expanded="false"
            >
                <i class="joorney-icon" data-icon="checklist" aria-hidden="true"></i>
                <span class="joorney-nav-checklist-dot" aria-hidden="true"></span>
            </button>
            <button
                type="button"
                id="open-extension-shortcut"
                class="joorney-icon-btn"
                title="Keyboard shortcuts"
                aria-label="Keyboard shortcuts"
                data-i18n-title="options_keyboardShortcuts"
                data-i18n-aria-label="options_keyboardShortcuts"
            >
                <i class="joorney-icon" data-icon="keyboard" aria-hidden="true"></i>
            </button>
        </nav>

        <!-- Announcement: rendered by options/index.js (loadAnnouncement) -->
        <div id="joorney-announcement" class="joorney-announce-wrap" hidden></div>

        <!-- Content -->
        <div id="joorney-page-container" class="flex-fill"></div>

        <!-- Onboard -->
        <aside id="joorney_checklist" class="onboarding-checklist d-none" aria-labelledby="joorney_checklist_title">
            <h2 id="joorney_checklist_title" class="joorney-cl-title" data-i18n="checklist_panelTitle">Get started with Joorney</h2>
            <p class="joorney-cl-sub" data-i18n="checklist_panelSubtitle">Short tours, one per page. Do them in any order.</p>
            <div class="joorney-cl-bar" role="progressbar" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-labelledby="joorney_checklist_progress_label">
                <div id="joorney_checklist_progress" class="joorney-cl-barfill"></div>
            </div>
            <div id="joorney_checklist_progress_label" class="joorney-cl-barlabel"></div>
            <div id="joorney_checklist_tours" class="joorney-cl-tours"><!-- DYNAMIC CONTENT --></div>
            <button id="joorney_checklist_hide_btn" class="joorney-cl-hide" type="button" data-i18n="checklist_hide">Hide checklist</button>
        </aside>

        <!-- Footer -->
        <footer class="text-center">
            <div class="text-center p-3">
                &copy; <span id="copyright-year">2023</span>
                <span data-i18n="options_allRightsReserved">All rights reserved:</span>
                <a id="copyright-link" href="https://github.com/MrSweeter/joorney">Joorney</a>
            </div>
            <div class="pb-2">
                <button type="button" id="joorney-announce-restore" class="joorney-link-btn is-strong joorney-announce-restore" hidden>
                    <i class="joorney-icon" data-icon="campaign" aria-hidden="true"></i><span data-i18n="options_announce_restore">Announcements</span>
                </button>
            </div>
            <div><span data-i18n="options_poweredBySunrise">Theme Switch based on location is powered by</span> <a href="https://sunrisesunset.io/">SunriseSunset.io</a></div>
        </footer>
    </body>
</html>
