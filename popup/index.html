<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Joorney</title>
        <!-- Material Symbols (assets/icons, npm run icons:fetch) -->
        <link href="../assets/icons/icons.css" rel="stylesheet">
        <!-- Options UI kit, copied next to the popup in the bundle -->
        <link href="../options/css/ui/tokens.css" rel="stylesheet">
        <link href="../options/css/ui/base.css" rel="stylesheet">
        <link href="../options/css/ui/feature_card.css" rel="stylesheet">
        <link href="../options/css/ui/mode_menu.css" rel="stylesheet">
        <link href="index.css" rel="stylesheet">

        <script src="index.js"></script>
    </head>

    <body>
        <header class="joorney-popup-head">
            <img class="joorney-popup-logo" src="/images/icon_128.png" alt="" aria-hidden="true">
            <div class="joorney-popup-host">
                <h1 id="joorney-popup-host" class="joorney-popup-hostname">Joorney</h1>
                <p id="joorney-popup-hostinfo" class="joorney-popup-hostinfo"></p>
            </div>
            <button
                type="button"
                id="joorney-popup-power"
                class="joorney-icon-btn"
                title="Disable Joorney on this site (reloads the page)"
                aria-label="Disable Joorney on this site (reloads the page)"
                data-i18n-title="popup_disable"
                data-i18n-aria-label="popup_disable"
                hidden
            >
                <i class="joorney-icon" data-icon="power_settings_new" aria-hidden="true"></i>
            </button>
            <button type="button" id="joorney-popup-options" class="joorney-icon-btn" title="Options" aria-label="Options" data-i18n-title="popup_options" data-i18n-aria-label="popup_options">
                <i class="joorney-icon" data-icon="settings" aria-hidden="true"></i>
            </button>
        </header>

        <main id="joorney-popup" class="joorney-popup-main"></main>

        <footer id="joorney-popup-reload" class="joorney-popup-reload" hidden>
            <span data-i18n="popup_reloadHelp">Odoo tabs pick up a change on their next page load.</span>
            <button type="button" id="joorney-popup-reload-btn" class="joorney-btn" data-i18n="popup_reload">Reload tab</button>
        </footer>
    </body>
</html>
