name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What problem would this solve?
          placeholder: When I work on a task in Odoo, I always need to…
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: What would you like to see?
      validations:
          required: true
    - type: input
      id: odoo_versions
      attributes:
          label: Odoo version(s) concerned
          placeholder: 18.0, saas-19.2…
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
