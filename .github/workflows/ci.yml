name: CI

on:
    pull_request:
    push:
        branches-ignore: [master]
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - run: npx biome ci .
            - run: npm run i18n-check

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            # Not `npm run prod`: it would also zip into store/artefacts, which only a release changes.
            - run: npm run build
              env:
                  NODE_ENV: production
            - name: Built manifest is valid
              run: |
                  node -e '
                      const manifest = require("fs").readFileSync("bundle/manifest.json", "utf8");
                      JSON.parse(manifest);
                      const left = manifest.match(/%[A-Z_]+%/g);
                      if (left) throw new Error(`Placeholders left in bundle/manifest.json: ${left.join(", ")}`);
                  '
